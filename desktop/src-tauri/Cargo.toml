[package]
name = "hugowriter-desktop"
version = "0.0.0"
description = "Hugowriter desktop host"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hugowriter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
